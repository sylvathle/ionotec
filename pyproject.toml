[project]
name = "ionotec"
version = "0.0.21"
authors = [
  { name="Sylvain Blunier", email="sylvain.blunier@gmail.com" },
]
description = "Code calculating TEC from RINEX information"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [ "georinex", "numpy", "pandas", "pymap3d", "datetime", "scipy", "pyarrow", "requests", "beautifulsoup4", "matplotlib", "cartopy"]

[project.urls]
Homepage = "https://github.com/sylvathle/ionotec"
Issues = "https://github.com/sylvathle/ionotec/issues"


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not slow'"
markers = [
    "network: talks to a remote server (run explicitly with -m network)",
    "slow: needs real RINEX files / takes more than a few seconds",
]
